services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: grantfinder
      POSTGRES_USER: grantfinder
      POSTGRES_PASSWORD: grantfinder_local
    ports:
      - "54329:5432"
    volumes:
      - grantfinder_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantfinder -d grantfinder"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  grantfinder_pgdata:
