services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: grantfinder
      POSTGRES_USER: grantfinder
      POSTGRES_PASSWORD: grantfinder_local
    ports:
      - "54329:5432"
    volumes:
      - grantfinder_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantfinder -d grantfinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://grantfinder:grantfinder_local@postgres:5432/grantfinder
      USE_PGVECTOR: "1"
      USE_LLM: "0"
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://grantfinder:grantfinder_local@postgres:5432/grantfinder
      LANGGRAPH_STRICT_MSGPACK: "true"
      REVIEW_STORE_BACKEND: postgres
    ports:
      - "8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully

  ingest:
    build: .
    command: >-
      sh -c "python scripts/init_pgvector.py &&
      python scripts/ingest_grants_pgvector.py"
    environment:
      DATABASE_URL: postgresql://grantfinder:grantfinder_local@postgres:5432/grantfinder
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BFF_URL: http://127.0.0.1:8000
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  grantfinder_pgdata:
